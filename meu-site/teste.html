<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Semântica visual</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        header {
            background: #ddd6fe;
            padding: 15px;
        }

        nav {
            background: #c4b5fd;
            padding: 10px;
        }

        main {
            background: #bbf7d0;
            padding: 20px;
            width: 65%;
        }

        aside {
            background: #fed7aa;
            padding: 20px;
            width: 25%;
        }

        .conteudo {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Sopa & Cia</h1>
    </header>

    <nav>
        Início | Cardápio | Contato
    </nav>

    <div class="conteudo">
        <main>
            <h2>Nosso cardápio</h2>
            <p>Sopa de abóbora: R$ 12</p>
            <p>Canja: R$ 15</p>
        </main>

        <aside>
            <h2>Promoção!</h2>
            <p>Compre duas sopas e ganhe um pão.</p>
        </aside>
    </div>
    

</body>

</html>
